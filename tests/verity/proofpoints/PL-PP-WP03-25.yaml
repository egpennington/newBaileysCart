id: PL-PP-WP03-25
name: Reservation 24-hour server-time boundary, idempotent retry keeps the original expiry, concurrent create cannot bypass the owner claim
feature: Family ownership core (families.create)
suite: PS-BILLING-LIFECYCLE
risk: high
owner: CODI
independent_reviewer: GAI
level: integration
slice_coverage: FULL for timestamps, retry and concurrency. Expiry effects on checkout are out of scope (no billing in Slice 1).
preconditions:
  - Auth and Firestore emulators, demo-newbaileyscart only; injectable FakeClock
steps:
  - Create a reservation at T0; check reservationExpiresAt = T0 + 86400 s, RFC 3339 UTC
  - Replay the same opId at T0 + 25 h; compare the full response
  - Same opId with a changed payload
  - Concurrent creates (distinct and identical opIds), 50 iterations each
  - Expiry boundary arithmetic at expiresAt - 1 ms, expiresAt, expiresAt + 1 ms
expected:
  - Replay returns the byte-identical original response; TTL never extended; one family
  - Changed payload is IDEMPOTENCY_KEY_REUSED with no writes
  - Concurrency never yields two families for one UID
evidence:
  - backend/functions/test/unit/domain.test.ts
  - backend/functions/test/emulator/familiesCreate.test.ts
  - backend/functions/test/e2e/callables.test.ts (replay and reuse over the wire)
  - Negative controls NC-2, NC-3
depths:
  D1: time arithmetic, expiry boundary, canonical request hash
  D2: emulator replay, reuse, concurrency stress
  D3: replay and IDEMPOTENCY_KEY_REUSED through the client SDK
  D4: GAI review
status: see docs/wp03/evidence/EVIDENCE_MANIFEST.md
