notes: "The Undo window (5 s, accessibility-extended, monotonic, latest-only, generation-keyed) remains UI policy; the domain sees only items.delete and items.undoDelete. The in-memory outbox grows by one operation per action for the process lifetime and is never compacted, dispatched or persisted (PL condition 6). No S2b storage, transport, cloud or new dependency. Cross-reference: PL-PP-WP02-04 (coalescing of an unsent delete and Undo) is exercised through the UI path here; its own record is unchanged."
