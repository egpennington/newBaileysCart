id: PL-PP-WP00-03
name: CI failure-gate behavior
feature: Build supply chain
suite: PS-BUILD-SUPPLY-CHAIN
risk: high
owner: CODI
independent_reviewer: GAI
level: integration
preconditions:
  - FORGE workflow with blocking jobs and an aggregate forge-gate job
steps:
  - For each gate, introduce a nonproduction failing fixture (failing unit test, compiler warning, lint violation, backend test failure, synthetic secret, real-Firebase config, checksum tamper, lockfile drift)
  - Run the gate command and record the exit code
  - Revert the fixture and confirm the gate passes again
  - In CI, push a failing fixture on a disposable branch and confirm forge-gate fails; revert before handoff
expected:
  - Every fixture makes its gate exit non-zero
  - No fixture remains in the handoff commit
evidence:
  - Local negative-run log; FORGE run link for the failing-fixture run
depths:
  D1: not applicable
  D2: local negative runs; CI negative run
  D3: not applicable
  D4: GAI review
status: see docs/wp00/evidence/EVIDENCE_MANIFEST.md
