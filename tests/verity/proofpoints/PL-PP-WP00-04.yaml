id: PL-PP-WP00-04
name: Dependency integrity and inventory
feature: Build supply chain
suite: PS-BUILD-SUPPLY-CHAIN
risk: high
owner: CODI
independent_reviewer: GAI
level: integration
preconditions:
  - Gradle strict locking and SHA-256 verification metadata; npm package-lock.json with npm ci
steps:
  - Build with verification enabled
  - Tamper one checksum and drift one lock entry; confirm build failure; restore
  - npm ci, npm audit --audit-level=high
  - osv-scanner over all lockfiles; produce CycloneDX SBOM
expected:
  - Verification and locks enforced (tamper and drift fail)
  - No known vulnerabilities, or each finding dispositioned by the PL
  - Dependency inventory (lockfiles plus SBOM) produced
evidence:
  - Build and negative-run logs; osv-scanner output; SBOM artifact
depths:
  D1: not applicable
  D2: local and CI
  D3: not applicable
  D4: GAI review
status: see docs/wp00/evidence/EVIDENCE_MANIFEST.md
