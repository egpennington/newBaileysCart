id: PL-PP-WP03-30
name: A second owned family only after the durable ownership-release milestone; trial remains consumed
feature: Family ownership core (families.create)
suite: PS-ACCESS-ISOLATION
risk: high
owner: CODI
independent_reviewer: GAI
level: integration
slice_coverage: PARTIAL (negative half only). Slice 1 has no release milestone (G-01, PL-2), so only "create is denied while unreleased" is testable. Must not be reported as overall PASS.
