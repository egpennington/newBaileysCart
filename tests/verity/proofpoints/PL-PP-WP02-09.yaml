  - "LP-3c: KEY_TRANSIENT and OPEN_ERROR give canReset=false and LockedRecovery.RETRY_ONLY, and a confirmed reset call does nothing (0 set-asides, 0 purges, 0 writes); TAG_KEY_MISSING keeps the clear-storage text; every other lock keeps the reset as reported; RESET_INCOMPLETE stays on a temporary lock across Try again; C1 OPEN_ERROR shows the approved text with no reset control and no clear-storage text, store files byte-identical while locked, no quarantine, 0 CAS/SETASIDE/PURGE while locked, same list (kept item present, never re-seeded) after restore; L3a still offers reset; L4b still shows RESET_INCOMPLETE and completes on the confirmed reset"
  - "SR-1: the failed open throws as before (FileNotFoundException), with exactly one connection observed, handle 0 and key bytes zero; the database exists and no .created marker is written; after the block is removed the store opens, writes the marker, keeps its data across a reopen, and its connection is released on close; each observer sees only its own open; the closed connection becomes collectable; on the preflight I/O failure the IOException propagates as before, no connection is opened, the observed key material is wiped and the account files are byte-identical, and after the block is removed the store reopens with the same data; DUR-1 still shows one WAL connection at synchronous=FULL with secure_delete=1 and temp_store=MEMORY"
