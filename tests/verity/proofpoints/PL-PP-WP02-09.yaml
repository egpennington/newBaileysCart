  - "LP-2: UNWRAP_FAILED and DB_UNREADABLE show the locked screen with no editable control; all account files byte-identical across retries, both cancels and a SIGKILL relaunch; the confirmed locked reset moves every file into quarantine byte-identical and starts one seeded list; a failed reset is never reported as done"
