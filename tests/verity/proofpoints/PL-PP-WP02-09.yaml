notes: "D-4 (PL-approved, demo scope): an unsynced demo outbox may be unrecoverable after key loss. Quarantine has no size or count cap (accepted for fictional data). | LP-2: the locked/reset wording is PL-approved (final at 5dad431: demo_locked_body and demo_notice_reset_incomplete); TAG_KEY_MISSING and open errors offer no in-app reset (clear app storage) | LP-3a: L3a overwrote bytes at offset 24 of the wrapped key file and the store reported KEY_MISSING (LP-2's tamper reported UNWRAP_FAILED); both are fail-closed locks. A lock that cannot be reset (TAG_KEY_MISSING) is still D1-only (BC-LP2-LP3 carry-forward, open) | LP-3c: a persistently failing Keystore (KEY_TRANSIENT on every retry) has no in-app way forward; a reset after repeated retries was considered and not adopted (CipherMuse/PL). OPEN_ERROR is not claimed to be temporary, and the wording claims neither that nothing changed nor that the failure is temporary. Interrupted-reset state is not persisted beyond the LP-1 marker (no storage-format change). C1 leaves one unused Keystore KEK alias on the emulator (KeyManager.create generates the alias before its write fails) | SR-1: cleanup is checked deterministically through two private fields of the pinned SQLCipher 4.20.0 connection (mConnectionPtr is 0 after dispose; mConfiguration.password is the same array object as KeyMaterial.sqlcipherKey, verified by bytecode inspection: no copy in SupportOpenHelperFactory, SupportHelper, SQLiteOpenHelper, SQLiteDatabase or SQLiteDatabaseConfiguration), so these checks must be revisited when SQLCipher is upgraded. The garbage-collection test is supporting evidence only; collection cannot be forced. TxnHook (internal, no-op by default, set only by this module's crash-injection tests) is kept unchanged; extracting it from the write path is recorded as separate debt. SR-1 correction (CipherMuse-recommended scope extension): an exception thrown by the pre-open copy (AccountStore.preflight, for example an I/O error) now wipes the unwrapped key before it is reported exactly as before; previously the key stayed unwiped until garbage collection. The test-only observer gained onKey(KeyMaterial) so this path, which opens no connection, is checked deterministically through KeyMaterial.isWiped()"
