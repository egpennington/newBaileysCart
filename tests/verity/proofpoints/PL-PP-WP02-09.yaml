slice_coverage: "PARTIAL. Store-level fail-closed behavior. The user-confirmed reset UI (P-4) does not exist until LP-2/LP-3. | LP-2: the app shows a non-editable locked screen for every lock, never seeds or recreates, and resets only after a two-step confirmation (healthy: purge + seed; locked: RecoveryController set-aside, never delete) | LP-3a: a closed or retired instance cannot write, purge, reset, set aside or publish; on device a tampered key file and a damaged database stay locked across retries and restarts with files unchanged; set-aside interrupted across restarts stays incomplete until confirmed | LP-3c: KEY_TRANSIENT and OPEN_ERROR (a possibly temporary or unknown opening failure) offer Try again only, with the approved neutral wording: no reset (set-aside) and no clear-storage advice, whatever the store reports; every other lock, the interrupted-reset notices and the confirmed reset are unchanged | SR-1: connection lifetime. The process-wide ConnectionRegistry is removed (it kept every connection, with its last 20 operations' SQL and bind arguments, for the process lifetime); an optional per-open ConnectionObserver (internal, null in production) replaces it. A failure after the database opens (the first-creation .created marker write) now closes the database and its connection and wipes the key before the failure is reported, as every earlier failure path already did; an exception from the pre-open copy (preflight) now also wipes the key (SR-1 correction)"
