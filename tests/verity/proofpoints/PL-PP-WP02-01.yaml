id: PL-PP-WP02-01
name: "Process-death durability: every committed outbox transition is recovered byte-for-byte after SIGKILL at each crash point, and dispatch resumes without loss or double effect"
feature: "Encrypted local shopping-list storage (:core:storage, BC-S2-LOCAL-PERSIST LP-1) over the S2a domain ports"
suite: PS-STORAGE-LOCAL
risk: high
owner: CODI
independent_reviewer: GAI
level: "instrumented (D2)"
slice: "BC-S2-LOCAL-PERSIST LP-1 (module promoted from the BC-UI-S2b spike; not on :app; fictional data only)"
slice_coverage: "PARTIAL. Module-level process death (real SIGKILL of a separate :victim process). No app-level restart until LP-2/LP-3. | LP-2: app-level wiring of the debug LOCAL DEMO: seed once, startup recovery, ordered commit-before-render (D1) and app restart after SIGKILL (D3) | LP-3a: one process-wide persistence owner and serial executor; the previous ViewModel's session closes before the next opens, in either creation/clear order; confirmed (committed and shown) writes survive SIGKILL, force-stop and ViewModel handover"
steps:
  - "Run the coordinator scenario in VictimService and kill it at 7 crash points x 50 runs; recover with SpikeStores.recover and drain"
  - "Interrupt a set-aside after 1..3 file moves; resume"
  - "LP-2 D1: PersistentDemoListTest over a fake store (seed once, restart recovery, Undo not restored, commit before render, refused/throwing commit, 25 rapid actions in order)"
  - "LP-2 D3: debug app on the emulator: Add, Edit, Delete+Undo, Delete; SIGKILL (kill -9) with and without an open Undo slot; force-stop; relaunch"
  - "LP-3a D1: PersistentDemoListLifecycleTest: overlapping and sequential instances on one queued serial executor (both Android orders), 20 alternating handovers, 200 instances from 4 caller threads on real threads, a retired instance's queued work"
  - "LP-3a D3 (debug app, emulator, debug-only BCLP3-TRACE logcat + trace_check.py): L1 confirmed add then SIGKILL and force-stop; L2 delete then SIGKILL; L5a 10 handovers by NEW_TASK|CLEAR_TASK after a confirmed add; L5b 5 handovers right after an unconfirmed add; L5c 5 handovers by am start -R; L5d 4 rotations while opening"
expected:
  - "The recovered disk state equals the model at every crash point (350/350); IN_FLIGHT recovers as RETRY_WAIT; the sibling family is intact; no Q-7 violation"
  - "An interrupted set-aside resumes byte-identically"
  - "LP-2: the list after relaunch equals the list before the kill; the Undo slot is not restored and the delete stands; the seed is never written again; nothing renders before its commit succeeds; each write's expected value is the previous committed value"
  - "LP-3a: at most one session open at any time (D1 maxOpenSessions 1; D3 trace T4); every storage call on the one persistence thread; a confirmed write is present after every handover and restart; the seed is written once"
