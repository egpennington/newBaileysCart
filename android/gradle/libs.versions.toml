# Pinned toolchain for WP-00. Rationale and sources: docs/wp00/VERSION_DECISION_RECORD.md
[versions]
agp = "9.4.0"
kotlin = "2.4.10"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
junit = "4.13.2"

# :core:storage only (BC-S2-LOCAL-PERSIST LP-1; LP-0 D-2; promoted from the BC-UI-S2b spike). Not used by :app or :core:model.
room = "2.8.5"
ksp = "2.3.13"
sqlcipher = "4.20.0"
androidxSqlite = "2.7.1"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

# Android platform (P4-ADR-11: minSdk 26, PL-approved 2026-10-26)
minSdk = "26"
compileSdk = "37"
targetSdk = "36"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# :core:storage only (LP-1)
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidxSqlite" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# :core:storage only (LP-1)
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
